<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mi tienda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#F2F2F8;--cd:#fff;--ink:#14142B;--mut:#6A6A85;--line:#E3E3EE;--acc:#3B36C8;--ai:#fff;--h1:#2B2790;--h2:#4B3FE0;--lime:#C8F169;--ok:#13795B;--bad:#C2362B;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D0D1A;--cd:#171730;--ink:#EDEDFA;--mut:#9A9AB8;--line:#2A2A48;--acc:#A29DFF;--ai:#0D0D1A;--h1:#1B1858;--h2:#3A30B8;--ok:#5FD8A8;--bad:#FF8A7D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D0D1A;--cd:#171730;--ink:#EDEDFA;--mut:#9A9AB8;--line:#2A2A48;--acc:#A29DFF;--ai:#0D0D1A;--h1:#1B1858;--h2:#3A30B8;--ok:#5FD8A8;--bad:#FF8A7D;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 "Plus Jakarta Sans",system-ui,sans-serif}
main{width:min(100% - 24px,760px);margin:0 auto;padding:14px 0 120px;animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
h1{font:800 25px/1.1 "Plus Jakarta Sans",sans-serif;margin:6px 0 12px;display:flex;justify-content:space-between;align-items:center}
.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,var(--h1),var(--h2));color:#fff;border-radius:22px;padding:16px;margin-bottom:10px}
.hero::after{content:"";position:absolute;right:-46px;top:-46px;width:160px;height:160px;border-radius:50%;background:rgba(200,241,105,.18)}
.hero b{display:block;font:800 38px/1.05 "Plus Jakarta Sans",sans-serif;color:var(--lime);margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;position:relative;z-index:1}.chip{background:rgba(255,255,255,.15);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:600}
.seg{display:flex;background:var(--line);border-radius:14px;padding:3px;margin-bottom:10px}.seg button{flex:1;border:0;border-radius:11px;padding:7px 4px;background:none;color:var(--mut);font:600 15px inherit}.seg .on{background:var(--cd);color:var(--ink)}
.card{background:var(--cd);border-radius:16px;padding:12px 14px;margin-bottom:10px;overflow-wrap:anywhere}.card h3{margin:0 0 6px;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}.row+.row{border-top:1px solid var(--line)}
.mut{color:var(--mut);font-size:13px}.pos{color:var(--ok)}.neg{color:var(--bad)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin:4px 0}
.btn,.sm{font:700 15px inherit;border:0;border-radius:12px;padding:11px 14px;background:var(--acc);color:var(--ai);cursor:pointer}.btn{width:100%;margin-top:6px}.sm{padding:6px 10px;font-size:13px}.gr{background:var(--line);color:var(--ink)}.rd{background:var(--bad);color:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
.mrow{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0}.mrow span:last-child{min-width:70px;text-align:right}
.th{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--line);flex:none}
#nav{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
#nav div{pointer-events:auto;max-width:460px;margin:auto;display:flex;background:var(--cd);border-radius:22px;box-shadow:0 6px 24px #0003;padding:4px}
#nav button{flex:1;border:0;background:none;color:var(--mut);font:600 11px inherit;padding:7px 2px;border-radius:18px}#nav button span{display:block;font-size:19px}#nav .on{background:var(--acc);color:var(--ai)}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:20px;display:none;z-index:9}
.ch{border:1px solid var(--line);background:var(--cd);color:var(--ink);border-radius:99px;padding:10px 15px;font:600 14px inherit;margin:3px 4px 3px 0;cursor:pointer}.ch.on{background:var(--acc);color:var(--ai);border-color:var(--acc)}.stp{display:flex;align-items:center;gap:12px;margin:6px 0}.stp .sm{min-width:42px;height:42px;font-size:20px}.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.qa button{border:0;background:var(--cd);color:var(--ink);border-radius:16px;padding:12px 4px;font:700 12px inherit;line-height:1.6}
.fc{border:0;background:var(--cd);color:var(--ink);border-radius:16px;padding:16px 10px;font:600 15px inherit;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;margin:0;width:100%;overflow-wrap:anywhere}
</style></head><body><main id="app"></main><nav id="nav"></nav><div id="t"></div>
<script>
const KEY='mi-tienda-v2',$=i=>document.getElementById(i),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),M=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('es-UY'),
today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},
num=i=>Math.max(0,parseFloat($(i).value)||0),tt=v=>v.pr*v.k,tot=p=>sum(p.tl,t=>t.q),fdt=d=>d.slice(8)+'/'+d.slice(5,7);
let S={ini:0,inip:0,min:2,meta:0,prendas:[],ventas:[],gastos:[],pers:[],tr:[]};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'null')||{})}catch(e){}
try{const t=localStorage.getItem('ti-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
let tab='inicio',per='mes',edP=null,pimg=null,armed=null;
const img=id=>{try{return localStorage.getItem('ti-'+id)}catch(e){return null}};
function toast(m){const t=$('t');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2000)}
function save(){armed=null;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar')}render()}
function theme(){const r=document.documentElement,n=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))=='dark'?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('ti-theme',n)}catch(e){}}
function arm(k,fn){if(armed!==k){armed=k;render();return}fn()}
const row=(a,b,c)=>`<div class=row><span>${a}</span><b class="${c||''}">${b}</b></div>`;
function calc(){const cob=sum(S.ventas,v=>v.ab),deb=sum(S.ventas,v=>tt(v)-v.ab),gN=sum(S.gastos,g=>g.a),ret=sum(S.tr.filter(t=>t.de=='neg'),t=>t.a),apo=sum(S.tr.filter(t=>t.de=='per'),t=>t.a),
pi=sum(S.pers.filter(x=>x.t=='i'),x=>x.a),pg=sum(S.pers.filter(x=>x.t=='g'),x=>x.a),sN=S.ini+cob-gN-ret+apo,sP=S.inip+pi-pg+ret-apo,
neta=sum(S.ventas,v=>(v.pr-v.c)*v.k)-sum(S.gastos.filter(g=>g.cat!='Mercadería'),g=>g.a);
return{cob,deb,sN,sP,ret,apo,neta,pi,pg,retirable:Math.max(0,Math.min(sN,neta-(ret-apo))),inv:sum(S.prendas,p=>p.c*tot(p))}}
const NAV=[['inicio','📊','Inicio'],['ventas','🛍️','Ventas'],['stock','👗','Stock'],['gastos','💸','Gastos'],['plata','👛','Mi plata']],R={};
function go(t){tab=t;fol=null;cb=null;dr=null;rp=null;pimg=null;render();scrollTo(0,0)}
function render(){S.combos=S.combos||[];S.marcas=S.marcas||[];S.fijos=S.fijos||[];if(autoF())try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}const h=R[tab]();$('app').innerHTML=h;$('nav').innerHTML='<div>'+NAV.map(n=>`<button class="${n[0]==tab?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')+'</div>';
try{const d=today(),o=JSON.parse(localStorage.getItem(KEY+'-auto')||'null');if((S.ventas.length||S.prendas.length)&&(!o||o.d!=d))localStorage.setItem(KEY+'-auto',JSON.stringify({d,s:S}))}catch(e){}}
const hd=t=>`<h1>${t}<button class="sm gr" onclick="theme()">🌓</button></h1>`;

R.inicio=()=>{const c=calc(),T=today(),ym=T.slice(0,7),inP=d=>per=='todo'||(per=='hoy'?d==T:d.slice(0,7)==ym),vp=S.ventas.filter(v=>inP(v.d)),gp=S.gastos.filter(g=>inP(g.d)),
vend=sum(vp,tt),mar=sum(vp,v=>(v.pr-v.c)*v.k),gas=sum(gp,g=>g.a),gasO=sum(gp.filter(g=>g.cat!='Mercadería'),g=>g.a),cash=mp=>M(sum(vp.filter(v=>v.mp==mp),v=>v.ab)),
pvm=sum(S.ventas.filter(v=>v.d.slice(0,7)==ym),tt),mp=S.meta?Math.min(100,Math.round(pvm/S.meta*100)):0,
ms=[...Array(6)].map((_,i)=>{const d=new Date(new Date().getFullYear(),new Date().getMonth()-5+i,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}),
mv=ms.map(k=>sum(S.ventas.filter(v=>v.d.slice(0,7)==k),tt)),mx=Math.max(1,...mv),du=S.ventas.filter(v=>v.ab<tt(v)),low=S.prendas.filter(p=>tot(p)<=S.min),
top={};vp.forEach(v=>top[v.n]=(top[v.n]||0)+v.k);const tl=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
return hd('Mi tienda')+`<div class=hero><small>Dinero disponible (negocio + personal)</small><b>${M(c.sN+c.sP)}</b><div class=chips><span class=chip>Negocio ${M(c.sN)}</span><span class=chip>Personal ${M(c.sP)}</span><span class=chip>Por cobrar ${M(c.deb)}</span></div></div>
<div class=qa><button onclick="go('ventas')">🛍️<br>Vender</button><button onclick="newP()">➕<br>Producto</button><button onclick="go('gastos')">💸<br>Gasto</button><button onclick="go('plata')">👛<br>Mi plata</button></div><div class=seg>${[['hoy','Hoy'],['mes','Este mes'],['todo','Todo']].map(x=>`<button class="${per==x[0]?'on':''}" onclick="per='${x[0]}';render()">${x[1]}</button>`).join('')}</div>
<div class=card>${row('Total vendido',M(vend),'pos')}${row('Ganancia de lo vendido (venta − costo)',M(mar),'pos')}${row('Gastos',M(gas),'neg')}${row('Resultado neto (sin contar mercadería comprada)',M(mar-gasO),mar-gasO<0?'neg':'pos')}${row('Cobrado en efectivo',cash('Efectivo'))}${row('Cobrado por transferencia',cash('Transferencia'))}${row('Podés retirar sin tocar el capital',M(c.retirable),'pos')}</div>
${resCard()}<div class=card><h3>Meta de ventas del mes</h3><input id=meta type=number inputmode=decimal value="${S.meta||''}" placeholder="Ej: 50000" onchange="S.meta=num('meta');save()">${S.meta?`<div class=mrow><div class=bar><i style="width:${mp}%"></i></div><span>${mp}%</span></div><div class=mut>Llevás ${M(pvm)}</div>`:''}</div>
${S.ventas.length?`<div class=card><h3>Ventas por mes</h3>${ms.map((k,i)=>`<div class=mrow><span class=mut>${k.slice(5)}/${k.slice(2,4)}</span><div class=bar><i style="width:${Math.round(mv[i]/mx*100)}%"></i></div><span>${M(mv[i])}</span></div>`).join('')}</div>`:''}
${du.length?`<div class=card><h3>Te deben ${M(c.deb)}</h3>${du.map(v=>{const d=tt(v)-v.ab;return`<div class=row style="align-items:flex-start"><div><b>${esc(v.cl||'Sin nombre')}</b><div class=mut>${esc(v.n)} · debe ${M(d)} · <span class="${ag(v)>7?'neg':''}">hace ${ag(v)} días</span></div><div style="display:flex;gap:6px"><input id="ab${v.id}" type=number inputmode=decimal placeholder="Abono" style="width:100px"><button class=sm onclick="abona('${v.id}')">Abonar</button></div></div>${v.tel?`<a class="sm gr" style="text-decoration:none;color:inherit" target=_blank rel=noopener href="https://wa.me/${v.tel.replace(/\D/g,'')}?text=${encodeURIComponent('Hola '+(v.cl||'')+', te recuerdo el pago pendiente de '+M(d)+'. ¡Gracias!')}">Recordar</a>`:''}</div>`}).join('')}</div>`:''}
${low.length?`<div class=card><h3>⚠️ Poco stock</h3>${low.map(p=>row(esc(p.n),tot(p)+' un.','neg')).join('')}</div>`:''}
${marcaCard(vp)}${tl.length?`<div class=card><h3>Más vendidos</h3>${tl.map(x=>row(esc(x[0]),x[1]+' un.')).join('')}</div>`:''}`}
function abona(id){const v=S.ventas.find(x=>x.id==id),a=Math.min(num('ab'+id),tt(v)-v.ab);if(!a)return toast('Poné un monto');v.ab+=a;toast('Abono registrado');save()}

const nv=()=>({cmb:null,pid:null,vi:null,k:1,mp:'Efectivo',pg:'todo',pr:undefined,dc:0,cl:'',tel:'',ab:0}),vl=t=>(t.t+' '+(t.c||'')).trim(),
chip=(on,fn,t)=>`<button class="ch ${on?'on':''}" onclick="${fn}">${t}</button>`,
blank=()=>({n:'',cat:'Remeras',m:'',s:'',c:0,p:0,g:S.gan||undefined,tl:[],ft:'',fc:'',fq:1});
let vs=nv(),dr=null,rp=null,gcat='Mercadería',ptype='g',trd='neg';
const gp=id=>S.prendas.find(x=>x.id==id);
R.ventas=()=>{const cm=cbf(vs.cmb),p=gp(vs.pid),v=p&&p.tl[vs.vi],bs=cm?(vs.pr??cm.p):p?(vs.pr??p.p):0,pr=Math.round(bs*(1-vs.dc/100));
return hd('Vender')+(!S.prendas.length?`<div class=card><span class=mut>Primero cargá productos en Stock.</span><button class=btn onclick="newP()">➕ Cargar producto</button></div>`:`<div class=card><h3>1. ¿Qué vendiste?</h3>${S.prendas.filter(x=>tot(x)>0).map(x=>chip(x.id==vs.pid,`vpick('${x.id}')`,esc(x.n+(x.s?' · '+x.s:'')))).join('')||'<span class=mut>No hay stock</span>'}${S.combos.filter(c=>cav(c)>0).map(c=>chip(c.id==vs.cmb,`vcmb('${c.id}')`,'🎁 '+esc(c.n))).join('')}
${p?`<h3 style="margin-top:12px">2. Talle y color</h3>${p.tl.map((t,i)=>t.q>0?chip(i==vs.vi,`vs.vi=${i};vs.k=1;render()`,esc(vl(t))+' ('+t.q+')'):'').join('')}`:''}
${v||cm?`<h3 style="margin-top:12px">3. Cantidad y precio</h3><div class=stp><button class=sm onclick="vk(-1)">−</button><b style="font-size:24px">${vs.k}</b><button class=sm onclick="vk(1)">+</button><input id=vpr type=number inputmode=decimal value="${bs}" oninput="vs.pr=num('vpr');vt()" style="flex:1"></div>
<div><span class=mut>Descuento</span> ${[0,5,10,15,20].map(x=>chip(vs.dc==x,`vs.dc=${x};render()`,x?x+'%':'Sin')).join('')}</div><h3 style="margin-top:12px">4. ¿Cómo pagó?</h3>${['Efectivo','Transferencia','Otro'].map(x=>chip(vs.mp==x,`vs.mp='${x}';render()`,x)).join('')}<div>${[['todo','Pagó todo'],['parte','Pagó una parte'],['nada','Todavía no pagó']].map(x=>chip(vs.pg==x[0],`vs.pg='${x[0]}';render()`,x[1])).join('')}</div>
${vs.pg=='parte'?`<input id=vab type=number inputmode=decimal placeholder="¿Cuánto pagó?" value="${vs.ab||''}" oninput="vs.ab=num('vab')">`:''}
<input placeholder="Cliente (opcional)" value="${esc(vs.cl)}" oninput="vs.cl=this.value">${vs.pg!='todo'?`<input inputmode=tel placeholder="Teléfono para recordarle" value="${esc(vs.tel)}" oninput="vs.tel=this.value">`:''}
<div class=hero style="margin:10px 0 0;padding:12px"><b id=vtt style="font-size:26px">${M(vs.k*pr)}</b></div><button class=btn onclick="sell()">✅ Registrar venta</button>`:''}</div>`)+
`<div class=card><h3>Últimas ventas</h3>${S.ventas.slice(-15).reverse().map(v=>`<div class=row><div><b>${esc(v.n)} ${esc(v.t)} ${esc(v.col||'')} ×${v.k}</b><div class=mut>${fdt(v.d)} · ${esc(v.cl||'')} · ganancia ${M((v.pr-v.c)*v.k)}${v.ab<tt(v)?' · <span class=neg>debe '+M(tt(v)-v.ab)+'</span>':''}</div></div><div><b>${M(tt(v))}</b> <button class="sm ${armed=='v'+v.id?'rd':'gr'}" onclick="arm('v${v.id}',()=>delV('${v.id}'))">${armed=='v'+v.id?'¿Seguro?':'✕'}</button></div></div>`).join('')||'<span class=mut>Sin ventas todavía</span>'}</div>`}
function vpick(id){const p=gp(id),ok=p.tl.map((t,i)=>t.q>0?i:-1).filter(i=>i>=0);vs=Object.assign(nv(),{pid:id,vi:ok.length==1?ok[0]:null,mp:vs.mp});render()}
function vk(d){const m=vs.cmb?cav(cbf(vs.cmb)):gp(vs.pid).tl[vs.vi].q;vs.k=Math.min(Math.max(1,vs.k+d),m);render()}
function vt(){const c=cbf(vs.cmb),p=gp(vs.pid);$('vtt').textContent=M(vs.k*Math.round((vs.pr??(c?c.p:p.p))*(1-vs.dc/100)))}
function sell(){if(vs.cmb)return sellC();const p=gp(vs.pid),v=p&&p.tl[vs.vi];if(!v)return toast('Elegí producto, talle y color');const pr=Math.round((vs.pr??p.p)*(1-vs.dc/100)),T=pr*vs.k,ab=vs.pg=='todo'?T:vs.pg=='nada'?0:Math.min(vs.ab||0,T);
v.q-=vs.k;if(tot(p)<=S.min)setTimeout(()=>toast('⚠️ Poco stock: '+p.n),2300);S.ventas.push({id:uid(),d:today(),pid:p.id,n:p.n+(p.s?' · '+p.s:''),t:v.t,col:v.c||'',k:vs.k,pr,c:p.c,cl:vs.cl.trim(),tel:vs.tel.trim(),ab,mp:vs.mp});toast('Venta registrada: '+M(T));vs=nv();save()}
function delV(id){const v=S.ventas.find(x=>x.id==id),p=gp(v.pid);if(v.cmb)v.cmb.forEach(i=>{const x=cvar(i);if(x)x.q+=v.k});if(p){let t=p.tl.find(x=>x.t==v.t&&(x.c||'')==(v.col||''));if(!t)p.tl.push(t={t:v.t,c:v.col||'',q:0});t.q+=v.k}S.ventas=S.ventas.filter(x=>x.id!=id);save()}

let cb=null,cbp=null;
const cbf=id=>S.combos.find(c=>c.id==id),cvar=i=>{const p=gp(i.pid);return p&&p.tl.find(t=>t.t==i.t&&(t.c||'')==(i.c||''))},
cav=c=>c.items.length?Math.min(...c.items.map(i=>{const v=cvar(i);return v?v.q:0})):0;
function newCb(){tab='stock';cb={n:'',p:0,items:[]};cbp=null;render();scrollTo(0,0)}
function cbAdd(j){const t=gp(cbp).tl[j];cb.items.push({pid:cbp,t:t.t,c:t.c||''});render()}
function cbForm(){const c=cb,p=gp(cbp),sug=sum(c.items,i=>(gp(i.pid)||{}).p||0),cost=sum(c.items,i=>(gp(i.pid)||{}).c||0);
return`${hd(c.id?'Editar combo':'Nuevo combo')}<div class=card><h3>Nombre</h3><input placeholder="Ej: Conjunto verano" value="${esc(c.n)}" oninput="cb.n=this.value"></div>
<div class=card><h3>Prendas del combo</h3>${c.items.map((i,j)=>{const q=gp(i.pid);return`<div class=row><span><b>${esc(q?q.n:'(borrada)')}</b> ${esc(vl(i))}</span><button class="sm gr" onclick="cb.items.splice(${j},1);render()">✕</button></div>`}).join('')||'<div class=mut>Elegí prendas de tu stock 👇</div>'}
<h3 style="margin-top:12px">Agregar prenda</h3>${S.prendas.map(x=>chip(x.id==cbp,`cbp='${x.id}';render()`,esc(x.n+(x.s?' · '+x.s:'')))).join('')||'<span class=mut>Primero cargá productos</span>'}
${p?`<h3 style="margin-top:8px">¿Qué talle y color?</h3>${p.tl.map((t,j)=>chip(0,`cbAdd(${j})`,esc(vl(t))+' ('+t.q+')')).join('')||'<span class=mut>Ese producto no tiene variantes</span>'}`:''}</div>
<div class=card><h3>Precio del combo</h3><input type=number inputmode=decimal placeholder="${sug}" value="${c.p||''}" oninput="cb.p=+this.value||0"><button class="sm gr" onclick="cb.p=${sug};render()">Usar la suma de las prendas (${M(sug)})</button><div class=mut style="margin-top:6px">Costo del combo ${M(cost)}${c.p?' · ganancia '+M(c.p-cost):''}</div></div>
<button class=btn onclick="saveCb()">💾 Guardar combo</button><button class="btn gr" onclick="cb=null;cbp=null;render()">Cancelar</button>`}
function saveCb(){if(!cb.n.trim())return toast('Falta el nombre');if(!cb.items.length)return toast('Agregá al menos una prenda');if(!cb.p)cb.p=sum(cb.items,i=>(gp(i.pid)||{}).p||0);const o={n:cb.n.trim(),p:cb.p,items:cb.items};if(cb.id)Object.assign(cbf(cb.id),o);else S.combos.push({id:uid(),...o});cb=null;cbp=null;toast('Combo guardado');save()}
function cbList(){return S.combos.length?`<div class=card><h3>🎁 Combos</h3>${S.combos.map(c=>`<div class=row style="align-items:flex-start"><div><b>${esc(c.n)}</b><div class=mut>${c.items.map(i=>esc((gp(i.pid)||{n:'?'}).n)+' '+esc(vl(i))).join(' + ')}</div><div class=mut>${M(c.p)} · se pueden armar ${cav(c)}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="sm gr" onclick="cb=JSON.parse(JSON.stringify(cbf('${c.id}')));delete cb.id;cb.n+=' (copia)';cbp=null;render();scrollTo(0,0)">📋</button><button class="sm gr" onclick="cb=JSON.parse(JSON.stringify(cbf('${c.id}')));cbp=null;render();scrollTo(0,0)">✏️</button><button class="sm ${armed=='c'+c.id?'rd':'gr'}" onclick="arm('c${c.id}',()=>{S.combos=S.combos.filter(x=>x.id!='${c.id}');save()})">${armed=='c'+c.id?'¿Seguro?':'🗑'}</button></div></div>`).join('')}</div>`:''}
function vcmb(id){vs=Object.assign(nv(),{cmb:id,mp:vs.mp});render()}
function dup(id){const p=gp(id);dr=JSON.parse(JSON.stringify(p));delete dr.id;dr.n+=' (copia)';Object.assign(dr,{ft:'',fc:'',fq:1});pimg=img(id);toast('Copia lista: editala y guardá');render();scrollTo(0,0)}
function sellC(){const c=cbf(vs.cmb);if(!c||cav(c)<vs.k)return toast('No alcanza el stock');const pr=Math.round((vs.pr??c.p)*(1-vs.dc/100)),T=pr*vs.k,ab=vs.pg=='todo'?T:vs.pg=='nada'?0:Math.min(vs.ab||0,T),cost=sum(c.items,i=>(gp(i.pid)||{}).c||0);
c.items.forEach(i=>{cvar(i).q-=vs.k});S.ventas.push({id:uid(),d:today(),pid:'',n:'🎁 '+c.n,t:'Combo',col:'',k:vs.k,pr,c:cost,cmb:JSON.parse(JSON.stringify(c.items)),cl:vs.cl.trim(),tel:vs.tel.trim(),ab,mp:vs.mp});toast('Venta registrada: '+M(T));vs=nv();save()}
const ag=v=>Math.round((new Date(today())-new Date(v.d))/864e5);
function autoF(){const T=today(),ym=T.slice(0,7),dd=+T.slice(8);let ch=0;S.fijos.forEach(f=>{if(f.last!=ym&&dd>=f.dia){S.gastos.push({id:uid(),d:ym+'-'+String(f.dia).padStart(2,'0'),a:f.a,cat:f.cat,nota:'fijo automático'});f.last=ym;ch=1}});return ch}
function fijosHtml(){return`<div class=card><h3>🔁 Gastos fijos automáticos</h3>${S.fijos.map(f=>`<div class=row><span>${esc(f.cat)} · día ${f.dia}</span><span><b>${M(f.a)}</b> <button class="sm gr" onclick="S.fijos=S.fijos.filter(x=>x.id!='${f.id}');save()">✕</button></span></div>`).join('')}<div class=g2><input id=fa type=number inputmode=decimal placeholder="Monto"><input id=fdd type=number inputmode=numeric placeholder="Día del mes"></div><button class="btn gr" onclick="addF()">＋ Agregar gasto fijo</button><div class=mut>Usa la categoría elegida arriba. Se carga solo cada mes, desde el mes que viene.</div></div>`}
function addF(){const a=num('fa'),d=Math.min(28,Math.max(1,Math.round(num('fdd'))||1));if(!a)return toast('Poné un monto');S.fijos.push({id:uid(),a,dia:d,cat:gcat,last:today().slice(0,7)});save()}
function repoCard(){const x=new Date();x.setDate(x.getDate()-30);const lim=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'),
L=S.prendas.filter(p=>tot(p)<=S.min).map(p=>({p,n:Math.max(1,Math.max(sum(S.ventas.filter(v=>v.pid==p.id&&v.d>=lim),v=>v.k),(S.min||1)*2)-tot(p))}));if(!L.length)return'';
const t='Lista de reposición:\n'+L.map(o=>'- '+o.p.n+(o.p.m?' ('+o.p.m+')':'')+': '+o.n+' un.').join('\n');
return`<div class=card><h3>🛒 Qué reponer (automático)</h3>${L.map(o=>row(esc(o.p.n),'pedir '+o.n+' · hoy '+tot(o.p))).join('')}<div class=mut>Calculado con lo que vendiste en 30 días.</div><a class=btn style="display:block;text-align:center;text-decoration:none" target=_blank rel=noopener href="https://wa.me/?text=${encodeURIComponent(t)}">Enviar lista por WhatsApp</a></div>`}
function resCard(){const T=today(),V=S.ventas.filter(v=>v.d==T),G=S.gastos.filter(g=>g.d==T),t=`Resumen ${fdt(T)}:\nVentas: ${V.length} (${M(sum(V,tt))})\nGanancia: ${M(sum(V,v=>(v.pr-v.c)*v.k))}\nGastos: ${M(sum(G,g=>g.a))}\nPor cobrar en total: ${M(calc().deb)}`;
return`<div class=card><h3>📤 Resumen del día</h3><div class=mut style="white-space:pre-line">${esc(t)}</div><a class=btn style="display:block;text-align:center;text-decoration:none" target=_blank rel=noopener href="https://wa.me/?text=${encodeURIComponent(t)}">Compartir por WhatsApp</a></div>`}
function marcaCard(vp){const g={};vp.forEach(v=>{const p=gp(v.pid),m=v.cmb?'Combos':(p&&p.m)||'Sin marca';g[m]=(g[m]||0)+(v.pr-v.c)*v.k});const e=Object.entries(g).sort((a,b)=>b[1]-a[1]);return e.length?`<div class=card><h3>Ganancia por marca</h3>${e.map(x=>row(esc(x[0]),M(x[1]),'pos')).join('')}</div>`:''}
function budCard(){const ym=today().slice(0,7),g=sum(S.pers.filter(x=>x.t=='g'&&x.d.startsWith(ym)),x=>x.a),p=S.bud?Math.min(100,g/S.bud*100):0;return`<div class=card><h3>Presupuesto personal del mes</h3><input id=bud type=number inputmode=decimal placeholder="Máximo a gastar" value="${S.bud||''}" onchange="S.bud=num('bud');save()">${S.bud?`<div class=mrow><div class=bar><i style="width:${p}%;background:${g>S.bud?'var(--bad)':'var(--acc)'}"></i></div><span>${Math.round(p)}%</span></div><div class=mut>Gastaste ${M(g)} de ${M(S.bud)} · te quedan ${M(Math.max(0,S.bud-g))}</div>`:''}</div>`}
let fgv=0;
const calcP=(c,g)=>{const v=c*(1+g/100);return S.red?Math.round(v/10)*10:Math.round(v)},
gtxt=()=>dr.c&&dr.p?`Ganancia por unidad ${M(dr.p-dr.c)} · margen sobre el precio ${Math.round((dr.p-dr.c)/dr.p*100)}%`:'Poné el costo y el % para calcular el precio';
function gcalc(){if(dr.g!=null&&dr.c){dr.p=calcP(dr.c,dr.g);$('dp').value=dr.p}$('gm').textContent=gtxt()}
function gback(){if(dr.c&&dr.p){dr.g=Math.round((dr.p/dr.c-1)*1000)/10;$('dg').value=dr.g}$('gm').textContent=gtxt()}
function gset(x){dr.g=x;if(dr.c)dr.p=calcP(dr.c,x);render()}
function applyFol(){S.prendas.filter(p=>(p.m||'')==fol).forEach(p=>{p.g=fgv;p.p=calcP(p.c,fgv)});toast('Precios actualizados');save()}
let fol=null;
const folNames=()=>[...new Set([...(S.marcas||[]),...S.prendas.map(p=>p.m).filter(Boolean)])].sort((a,b)=>a.localeCompare(b));
function fcard(n,i){const L=S.prendas.filter(p=>(p.m||'')==n);return`<button class=fc onclick="${i<0?"fol='';":`fol=folNames()[${i}];`}render()"><span style="font-size:32px">📁</span><b>${esc(n||'Sin marca')}</b><small class=mut>${L.length} prod. · ${sum(L,tot)} un.</small></button>`}
function folders(){const names=folNames();return`${hd('Stock')}<div class=g2 style="margin-bottom:10px"><button class=btn style="margin:0" onclick="newP()">➕ Producto</button><button class=btn style="margin:0" onclick="newCb()">🎁 Combo</button></div>
<div class=card><h3>Ganancia por defecto</h3><input id=gd type=number inputmode=decimal placeholder="% sobre el costo (ej: 80)" value="${S.gan||''}" onchange="S.gan=num('gd');save()"><div class=mut>Se usa al crear productos: ponés el costo y el precio de venta se calcula solo.</div><h3 style="margin-top:10px">Avisar con poco stock</h3><input id=gmn type=number inputmode=numeric placeholder="Unidades" value="${S.min}" onchange="S.min=num('gmn');save()"><div class=mut>Avisa cuando un producto tenga esta cantidad o menos.</div></div><div class=card><h3>Nueva carpeta (marca)</h3><div style="display:flex;gap:6px"><input id=fn placeholder="Nombre de la marca"><button class=sm onclick="addFol()">Crear</button></div></div>
${repoCard()}<div class=g2 style="margin-bottom:10px">${names.map((n,i)=>fcard(n,i)).join('')}${S.prendas.some(p=>!p.m)?fcard('',-1):''}</div>${names.length||S.prendas.length?'':'<div class=card><span class=mut>Creá una carpeta con el nombre de una marca y cargá tus productos adentro.</span></div>'}${cbList()}`}
function addFol(){const n=$('fn').value.trim();if(!n)return toast('Poné el nombre de la marca');if(folNames().includes(n))return toast('Esa carpeta ya existe');S.marcas.push(n);toast('Carpeta creada');save()}
function renFol(){const n=$('fr').value.trim();if(!n||n==fol)return;S.prendas.forEach(p=>{if(p.m==fol)p.m=n});S.marcas=S.marcas.filter(x=>x!=fol);if(!S.marcas.includes(n))S.marcas.push(n);fol=n;toast('Renombrada');save()}
function delFol(){if(S.prendas.some(p=>p.m==fol)){armed=null;render();return toast('Primero mové o borrá los productos')}S.marcas=S.marcas.filter(x=>x!=fol);fol=null;save()}
const secList=m=>{const a=[...new Set(S.prendas.filter(p=>(p.m||'')==(m||'')).map(p=>p.s||''))];return a.sort((x,y)=>x==''?-1:y==''?1:x.localeCompare(y))};
function vnew(id){const p=gp(id);dr={n:p.n,cat:p.cat,m:p.m,c:p.c,p:p.p,g:p.g,s:'',tl:[],ft:'',fc:'',fq:1};pimg=img(id);toast('Variante nueva: elegí otra sección');render();scrollTo(0,0)}
function newP(b){tab='stock';dr=blank();dr.m=b||'';pimg=null;render();scrollTo(0,0)}
R.stock=()=>{if(cb)return cbForm();if(!dr&&fol===null)return folders();if(dr){const d=dr;return`${hd(d.id?'Editar producto':'Nuevo producto')}<div class=card><h3>Nombre</h3><input placeholder="Ej: Remera oversize" value="${esc(d.n)}" oninput="dr.n=this.value"><h3 style="margin-top:10px">Categoría</h3>${['Remeras','Gorras','Conjuntos','Otros'].map(c=>chip(d.cat==c,`dr.cat='${c}';render()`,c)).join('')}<h3 style="margin-top:10px">Marca (carpeta)</h3>${folNames().map((x,i)=>chip(d.m==x,`dr.m=folNames()[${i}];render()`,esc(x))).join('')}<input placeholder="Otra marca nueva (o vacío = sin marca)" value="${folNames().includes(d.m)?'':esc(d.m)}" oninput="dr.m=this.value"><div class=g2><div><h3 style="margin:10px 0 0">Costo</h3><input type=number inputmode=decimal value="${d.c||''}" oninput="dr.c=+this.value||0;gcalc()"></div><div><h3 style="margin:10px 0 0">Ganancia %</h3><input id=dg type=number inputmode=decimal placeholder="Ej: 80" value="${d.g??''}" oninput="dr.g=this.value===''?undefined:+this.value;gcalc()"></div></div><div style="margin-top:4px">${[30,50,80,100].map(x=>chip(d.g==x,`gset(${x})`,x+'%')).join('')}${chip(S.red,"S.red=!S.red;if(dr.g!=null&&dr.c)dr.p=calcP(dr.c,dr.g);render()","Redondear a 10")}</div><h3 style="margin:10px 0 0">Precio de venta (se calcula solo)</h3><input id=dp type=number inputmode=decimal value="${d.p||''}" oninput="dr.p=+this.value||0;gback()"><div class=mut id=gm>${gtxt()}</div></div>
<div class=card><h3>Sección dentro de la carpeta</h3>${secList(d.m).filter(Boolean).map((x,i)=>chip(d.s==x,`dr.s=secList(dr.m).filter(Boolean)[${i}];render()`,esc(x))).join('')}<input placeholder="Sección nueva (ej: Color negro, Verano, Oversize)" value="${secList(d.m).includes(d.s)?'':esc(d.s)}" oninput="dr.s=this.value"><div class=mut>Cada variante es un producto aparte, en su propia sección dentro de la marca.</div></div><div class=card><h3>Talles, colores y cantidades</h3>${d.tl.map((t,i)=>`<div class=row><b>${esc(vl(t))}</b><div class=stp><button class="sm gr" onclick="dq(${i},-1)">−</button><b>${t.q}</b><button class="sm gr" onclick="dq(${i},1)">+</button><button class="sm gr" onclick="dr.tl.splice(${i},1);render()">✕</button></div></div>`).join('')||'<div class=mut>Todavía sin variantes. Agregá una abajo 👇</div>'}
<h3 style="margin-top:12px">Agregar talle y color</h3>${['S','M','L','XL','Única'].map(x=>chip(d.ft==x,`dr.ft='${x}';render()`,x)).join('')}<div class=g2><input placeholder="Talle" value="${esc(d.ft)}" oninput="dr.ft=this.value"><input placeholder="Color" value="${esc(d.fc)}" oninput="dr.fc=this.value"></div><div class=stp><span class=mut>Cantidad</span><button class="sm gr" onclick="dr.fq=Math.max(1,dr.fq-1);render()">−</button><b>${d.fq}</b><button class="sm gr" onclick="dr.fq++;render()">+</button></div><button class="btn gr" onclick="addVar()">＋ Agregar talle</button></div>
<div class=card><h3>Foto (opcional)</h3><input type=file accept="image/*" onchange="onFile(this)"></div><button class=btn onclick="saveP()">💾 Guardar producto</button><button class="btn gr" onclick="saveP(1)">➕ Guardar y crear otra variante (producto nuevo)</button><button class="btn gr" onclick="dr=null;render()">Cancelar</button>`}
return`${hd('📁 '+esc(fol||'Sin marca'))}<div class=g2 style="margin-bottom:10px"><button class="btn gr" style="margin:0" onclick="fol=null;render()">← Carpetas</button><button class=btn style="margin:0" onclick="newP(fol)">➕ Producto</button></div>${fol?`<div class=card><div style="display:flex;gap:6px"><input id=fr value="${esc(fol)}"><button class=sm onclick="renFol()">Renombrar</button></div><button class="sm ${armed=='fd'?'rd':'gr'}" onclick="arm('fd',delFol)">${armed=='fd'?'¿Seguro?':'🗑 Borrar carpeta vacía'}</button></div><div class=card><h3>Ganancia para toda la carpeta</h3><div style="display:flex;gap:6px"><input type=number inputmode=decimal placeholder="% sobre el costo" value="${fgv||''}" oninput="fgv=+this.value||0"><button class="sm ${armed=='fg'?'rd':''}" onclick="fgv?arm('fg',applyFol):toast('Poné el %')">${armed=='fg'?'¿Cambiar precios?':'Aplicar'}</button></div><div class=mut>Recalcula el precio de venta de todos los productos de esta carpeta.</div></div>`:''}<input placeholder="🔍 Buscar..." oninput="const q=this.value.toLowerCase();document.querySelectorAll('.pi').forEach(e=>e.style.display=e.dataset.s.includes(q)?'':'none')">
${secList(fol).map(sc=>(sc||secList(fol).length>1?`<h3 style="margin:14px 2px 6px">📂 ${esc(sc||'General')}</h3>`:'')+S.prendas.filter(p=>(p.m||'')==fol&&(p.s||'')==sc).map(p=>{const i=img(p.id),r=rp&&rp.id==p.id;return`<div class="card pi" data-s="${esc((p.n+' '+p.cat+' '+(p.m||'')).toLowerCase())}"><div class=row style="align-items:flex-start;gap:10px">${i?`<img class=th src="${i}">`:''}<div style="flex:1"><b>${esc(p.n)}</b> <span class=mut>${p.cat}${p.m?' · '+esc(p.m):''}</span><div class=mut>Costo ${M(p.c)} · Venta ${M(p.p)} · margen ${p.p?Math.round((p.p-p.c)/p.p*100):0}%</div><div class="mut ${tot(p)<=S.min?'neg':''}">${p.tl.map(t=>esc(vl(t))+': '+t.q).join(' · ')||'sin variantes'}</div></div></div>
<div style="display:flex;gap:6px;flex-wrap:wrap"><button class=sm onclick="rp={id:'${p.id}',vi:null,q:1,c:''};render()">➕ Reponer</button><button class="sm gr" onclick="dup('${p.id}')">📋 Duplicar</button><button class="sm gr" onclick="vnew('${p.id}')">➕ Variante</button><button class="sm gr" onclick="dr=JSON.parse(JSON.stringify(p=gp('${p.id}')));Object.assign(dr,{ft:'',fc:'',fq:1});pimg=null;render();scrollTo(0,0)">✏️ Editar</button><button class="sm ${armed=='p'+p.id?'rd':'gr'}" onclick="arm('p${p.id}',()=>{S.prendas=S.prendas.filter(x=>x.id!='${p.id}');try{localStorage.removeItem('ti-${p.id}')}catch(e){}save()})">${armed=='p'+p.id?'¿Seguro?':'🗑 Borrar'}</button></div>
${r?`<div style="margin-top:10px"><h3>¿Cuál reponés?</h3>${p.tl.map((t,j)=>chip(rp.vi==j,`rp.vi=${j};render()`,esc(vl(t)))).join('')||'<span class=mut>Agregá variantes con Editar</span>'}<div class=stp><span class=mut>Cantidad</span><button class="sm gr" onclick="rp.q=Math.max(1,rp.q-1);render()">−</button><b>${rp.q}</b><button class="sm gr" onclick="rp.q++;render()">+</button></div><input type=number inputmode=decimal placeholder="Costo por unidad (opcional)" value="${rp.c||''}" oninput="rp.c=+this.value||0"><button class=btn onclick="repo()">Guardar reposición</button></div>`:''}</div>`}).join('')).join('')||'<div class=card><span class=mut>Carpeta vacía. Tocá ➕ Producto.</span></div>'}`}
function dq(i,d){dr.tl[i].q=Math.max(0,dr.tl[i].q+d);render()}
function addVar(){const t=dr.ft.trim();if(!t&&!dr.fc.trim())return toast('Poné talle o color');const c=dr.fc.trim(),x=dr.tl.find(y=>y.t==t&&(y.c||'')==c);if(x)x.q+=dr.fq;else dr.tl.push({t,c,q:dr.fq});dr.ft='';dr.fc='';dr.fq=1;render()}
function onFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,200/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);pimg=c.toDataURL('image/jpeg',.7);toast('Foto lista')};im.src=r.result};r.readAsDataURL(f)}
function saveP(nx){if(!dr.n.trim())return toast('Falta el nombre');if(dr.ft.trim()||dr.fc.trim())addVar();const o={n:dr.n.trim(),cat:dr.cat,m:dr.m.trim(),c:dr.c,p:dr.p,g:dr.g,s:(dr.s||'').trim(),tl:dr.tl};let p;if(dr.id){p=gp(dr.id);Object.assign(p,o)}else S.prendas.push(p={id:uid(),...o});if(pimg)try{localStorage.setItem('ti-'+p.id,pimg)}catch(e){toast('Foto muy pesada')}fol=o.m;if(nx){dr={n:o.n,cat:o.cat,m:o.m,c:o.c,p:o.p,g:o.g,s:'',tl:[],ft:'',fc:'',fq:1};pimg=img(p.id);toast('Listo. Ahora cargá la otra variante en otra sección')}else{dr=null;pimg=null;toast('Producto guardado')}save()}
function repo(){const p=gp(rp.id),v=p.tl[rp.vi];if(!v)return toast('Elegí talle y color');v.q+=rp.q;if(rp.c){p.c=rp.c;if(p.g!=null)p.p=calcP(p.c,p.g);S.gastos.push({id:uid(),d:today(),a:rp.c*rp.q,cat:'Mercadería',nota:p.n+' ×'+rp.q})}rp=null;toast('Stock actualizado');save()}

${fijosHtml()}<div class=card>${S.gastos.slice(-30).reverse().map(g=>`<div class=row><div><b>${esc(g.cat)}</b><div class=mut>${fdt(g.d)} ${esc(g.nota)}</div></div><div><b class=neg>${M(g.a)}</b> <button class="sm ${armed=='g'+g.id?'rd':'gr'}" onclick="arm('g${g.id}',()=>{S.gastos=S.gastos.filter(x=>x.id!='${g.id}');save()})">${armed=='g'+g.id?'¿Seguro?':'✕'}</button></div></div>`).join('')||'<span class=mut>Sin gastos</span>'}</div>`
function addG(){const a=num('ga');if(!a)return toast('Poné un monto');S.gastos.push({id:uid(),d:today(),a,cat:gcat,nota:$('gn').value.trim()});toast('Gasto guardado');save()}

R.plata=()=>{const c=calc(),bkv=(()=>{try{const o=JSON.parse(localStorage.getItem(KEY+'-auto'));return o?o.d:''}catch(e){return''}})();
return`${hd('Mi plata')}<div class=hero><small>Patrimonio estimado</small><b>${M(c.sN+c.sP+c.inv+c.deb)}</b><div class=chips><span class=chip>Negocio ${M(c.sN)}</span><span class=chip>Personal ${M(c.sP)}</span><span class=chip>Inventario ${M(c.inv)}</span><span class=chip>Por cobrar ${M(c.deb)}</span></div></div>
<div class=card><h3>Pasar plata entre cuentas</h3>${chip(trd=='neg',"trd='neg';render()",'Retiro: negocio → a mí')}${chip(trd=='per',"trd='per';render()",'Aporte: de mí → negocio')}<input id=tm type=number inputmode=decimal placeholder="Monto"><button class=btn onclick="trf()">Transferir</button><div class=mut>No cuenta como ganancia ni como gasto.</div></div>
<div class=card><h3>Ingreso / gasto personal</h3><div class=g2><div>${chip(ptype=='g',"ptype='g';render()",'Gasto')}${chip(ptype=='i',"ptype='i';render()",'Ingreso')}</div><input id=pa type=number inputmode=decimal placeholder="Monto"></div><input id=pcat placeholder="Categoría (comida, sueldo, salidas...)"><button class=btn onclick="addPe()">Guardar</button>${S.pers.slice(-12).reverse().map(x=>`<div class=row><span>${fdt(x.d)} ${esc(x.cat)}</span><span><b class="${x.t=='i'?'pos':'neg'}">${x.t=='i'?'+':'-'}${M(x.a)}</b> <button class="sm gr" onclick="S.pers=S.pers.filter(y=>y.id!='${x.id}');save()">✕</button></span></div>`).join('')}</div>
${budCard()}<div class=card><h3>Saldos iniciales</h3><div class=g2><input id=ini type=number inputmode=decimal placeholder="Negocio" value="${S.ini||''}" onchange="S.ini=num('ini');save()"><input id=inp type=number inputmode=decimal placeholder="Personal" value="${S.inip||''}" onchange="S.inip=num('inp');save()"></div></div>
<div class=card><h3>Respaldo</h3><textarea id=bkt rows=3 placeholder="Acá aparece tu copia. Para restaurar, pegala acá."></textarea><div class=g2><button class=sm onclick="bk()">Generar y copiar</button><button class="sm ${armed=='rs'?'rd':'gr'}" onclick="arm('rs',rs)">${armed=='rs'?'¿Reemplazar todo?':'Restaurar'}</button></div><div class=mut id=bkm>Los datos viven en este celular. Cada día se guarda una copia automática${bkv?' (última: '+bkv+')':''}.</div></div>`}
function trf(){const a=num('tm'),de=trd,c=calc();if(!a)return toast('Poné un monto');if(a>(de=='neg'?c.sN:c.sP))return toast('Saldo insuficiente');S.tr.push({id:uid(),d:today(),a,de});toast('Transferido');save()}
function addPe(){const a=num('pa');if(!a)return toast('Poné un monto');S.pers.push({id:uid(),d:today(),a,t:ptype,cat:$('pcat').value.trim()});save()}
function bk(){const t=JSON.stringify(S),a=$('bkt');a.value=t;a.select();try{navigator.clipboard.writeText(t).then(()=>$('bkm').textContent='Copiado. Pegalo en tus notas o WhatsApp.')}catch(e){$('bkm').textContent='Copiá el texto a mano.'}}
function rs(){try{const o=JSON.parse($('bkt').value);if(!o.prendas||!o.ventas)throw 0;S=Object.assign({ini:0,inip:0,min:2,meta:0,pers:[],tr:[]},o);toast('Copia restaurada');save()}catch(e){armed=null;render();toast('Copia inválida')}}
render();
</script></body></html>
