<style>
:root{--bg:#F2F2F8;--card:#fff;--ink:#14142B;--mut:#6A6A85;--line:#E3E3EE;--acc:#3B36C8;--accink:#fff;--h1:#2B2790;--h2:#4B3FE0;--lime:#C8F169;--ok:#13795B;--bad:#C2362B;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D0D1A;--card:#171730;--ink:#EDEDFA;--mut:#9A9AB8;--line:#2A2A48;--acc:#A29DFF;--accink:#0D0D1A;--h1:#1B1858;--h2:#3A30B8;--ok:#5FD8A8;--bad:#FF8A7D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D0D1A;--card:#171730;--ink:#EDEDFA;--mut:#9A9AB8;--line:#2A2A48;--acc:#A29DFF;--accink:#0D0D1A;--h1:#1B1858;--h2:#3A30B8;--ok:#5FD8A8;--bad:#FF8A7D;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.4 "DM Sans",system-ui,-apple-system,Segoe UI,sans-serif}
main{width:min(100% - 24px,760px);margin:0 auto;padding:clamp(10px,2.5vw,22px) 0 calc(112px + env(safe-area-inset-bottom,0px));min-width:0}
*{box-sizing:border-box}
img{max-width:100%}
button,input,select,textarea{max-width:100%}
.card,.hero{min-width:0;overflow-wrap:anywhere}
@media(min-width:700px){.two{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:clamp(18px,3vw,28px)}.hero b{font-size:clamp(34px,5vw,48px)}}
@media(max-width:420px){main{width:calc(100% - 20px)}h1{font-size:clamp(20px,6vw,24px)}.two{gap:8px}.card{padding-left:11px;padding-right:11px}.card.f{padding:12px}.row,.it{gap:7px}.sm{padding:7px 8px;font-size:0.857rem}.hero b{font-size:clamp(28px,9vw,36px)}#nav{padding-left:7px;padding-right:7px}#nav div{padding:5px;border-radius:18px}#nav button{font-size:0.714rem}#nav button span{font-size:1.214rem}}
h1{font:700 1.571rem/1.1 "Space Grotesk","DM Sans",system-ui,sans-serif;margin:6px 0 10px}
.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,var(--h1),var(--h2));color:#fff;border-radius:22px;padding:16px;margin-bottom:10px}
.hero::after{content:"";position:absolute;right:-46px;top:-46px;width:160px;height:160px;border-radius:50%;background:rgba(200,241,105,.18)}
.hero small{font-weight:600;opacity:.85}
.hero b{display:block;font:700 2.429rem/1.05 "Space Grotesk","DM Sans",system-ui,sans-serif;color:var(--lime);margin:4px 0 0;word-break:break-all}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;position:relative;z-index:1}
.chip{background:rgba(255,255,255,.15);border-radius:99px;padding:4px 10px;font-size:0.857rem;font-weight:600}
.seg{display:flex;background:var(--line);border-radius:14px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;border-radius:11px;padding:7px 4px;background:transparent;color:var(--mut);font:600 1rem "DM Sans",system-ui,sans-serif}
.seg .on{background:var(--card);color:var(--ink)}
.card{background:var(--card);border-radius:16px;padding:2px 14px;margin-bottom:10px}
.card.f{padding:12px 14px}
.row,.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
.row+.row,.it+.it,.row+.it,.it+.row{border-top:1px solid var(--line)}
.row b{font-weight:600}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.mut{color:var(--mut);font-size:0.893rem}
label{display:block;font-size:0.929rem;font-weight:600;margin:9px 0 3px}
input,select,textarea{width:100%;box-sizing:border-box;font:inherit;font-size:1.143rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
textarea{font-size:1rem;margin-top:10px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{width:100%;margin-top:12px;padding:11px;border:0;border-radius:12px;background:var(--acc);color:var(--accink);font:700 1.143rem "DM Sans",system-ui,sans-serif}
.sm{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:6px 10px;font:600 0.929rem "DM Sans",system-ui,sans-serif;text-decoration:none;text-align:center;display:inline-block}
.sm.bad{color:var(--bad)}
.stp{display:flex;align-items:center;gap:8px;min-width:0}
.stp:not(.actions)>.sm{width:auto;height:auto;min-height:34px;padding:7px 10px;font-size:0.857rem;line-height:1.2;white-space:nowrap;flex:0 0 auto}
.it>.stp:not(.actions) .sm{width:34px;height:34px;padding:0;font-size:1.286rem}
.stp.actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.stp.actions .sm{width:auto;height:auto;min-height:34px;padding:7px 9px;font-size:0.857rem;line-height:1.2;white-space:nowrap;flex:0 0 auto}
.it>div[style*="flex:1"]{flex:1 1 160px!important;min-width:0}
.it>.stp:not(.actions){flex:0 0 auto;gap:5px}
.stp b{min-width:26px;text-align:center;font-size:1.143rem}
.col{display:flex;flex-direction:column;gap:6px}
.badge{display:inline-block;font-size:0.857rem;font-weight:700;background:var(--bad);color:#fff;border-radius:99px;padding:1px 8px;margin-left:6px}
.err{color:var(--bad);font-size:1rem;margin:8px 0 0}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.mrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;font-size:1rem}
.mrow .bar{margin:6px 0}
.th{border-radius:12px;object-fit:cover;flex:none;background:var(--line)}
.th.ph{display:flex;align-items:center;justify-content:center;font-size:1.571rem}
input[type="checkbox"]{width:22px;height:22px;flex:none;padding:0;margin:0;accent-color:var(--acc)}
.tag{display:inline-block;background:var(--line);color:var(--acc);border-radius:999px;padding:1px 8px;font-size:0.857rem;font-weight:600;margin-right:6px;cursor:pointer}
.fold{cursor:pointer}.mh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0 4px;border-top:1px solid var(--line)}
label.fb{margin:0;font-size:1rem;cursor:pointer;display:inline-block}
#zm{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#zm img{max-width:100%;max-height:85%;border-radius:16px}
#nav{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
#nav div{pointer-events:auto;max-width:520px;margin:0 auto;display:flex;background:var(--card);border-radius:22px;padding:6px;box-shadow:0 6px 24px rgba(20,20,60,.22)}
#nav button{flex:1;border:0;background:transparent;color:var(--mut);border-radius:16px;padding:6px 0 4px;font:600 0.786rem "DM Sans",system-ui,sans-serif}
#nav button span{display:block;font-size:1.286rem;line-height:1.2}

<body>
<main id="app"></main>

<div id="zm" onclick="this.style.display='none'"></div>
<script>
var calcExpr='',calcDisplay='0',calcFresh=true,calcError=false,calcHist=[];
var per='mes',editId=null,fq='',pend=null,IMG={},DB=null,BASE='',KEY='ropa-v1',tab='resumen',dirty=false,ref=null,armed=null,sel={},bcv='',bpv='',bok='',bco='set',bpo='set',brd='0',fcat='',fso='n',fv='',bsv='',bmr='',fmar='',sqv='all',spc='',squ='p',gsal=0,gdeb=0,fopen={},pre='',isel={},iqty={},iq='',iall='',inum='',iok='',repoL=[],S=norm();
function norm(o){o=Object.assign({ini:0,min:2,mm:30,gan:100,marcas:[],bk:0,undo:null,meta:0,prendas:[],ventas:[],gastos:[]},o||{});o.ventas.forEach(function(v){if(v.ab==null)v.ab=v.pd?v.pr*v.k:0});return o}
var okStore=true;try{localStorage.setItem('t','1');localStorage.removeItem('t');var r=localStorage.getItem(KEY);if(r)S=norm(JSON.parse(r))}catch(e){okStore=false}

var row=function(a,b,c){return '<div class="row"><span>'+a+'</span><b class="'+(c||'')+'">'+b+'</b></div>'};

function getImg(id){if(IMG[id])return IMG[id];try{var u=localStorage.getItem('ropa-img-'+id);if(u)IMG[id]=u;return u}catch(e){return null}}

function pull(){if(!DB)return;var need=S.prendas.filter(function(p){return p.im&&!getImg(p.id)});if(!need.length)return;Promise.all(need.map(function(p){return DB.doc(BASE+'img_'+p.id).get().then(function(s){var u=s.exists&&s.data().d;if(u){IMG[p.id]=u;try{localStorage.setItem('ropa-img-'+p.id,u)}catch(e){}}}).catch(function(){})})).then(render)}
function thumb(p,z,ph){if(!p)return '';var u=p.im&&getImg(p.id),s='width:'+z+'px;height:'+z+'px';return u?'<img class="th" style="'+s+'" src="'+u+'" alt="" onclick="zoom(\''+p.id+'\')">':(ph?'<div class="th ph" style="'+s+'">👗</div>':'')}

function prevHtml(){var u=pend||(editId&&getImg(editId));return u?'<img class="th" style="width:96px;height:96px" src="'+u+'" alt=""><button class="sm" style="margin-left:10px" onclick="rmImg()">Quitar foto</button>':''}
function onFile(i){var f=i.files&&i.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);pend=c.toDataURL('image/jpeg',.7);q('pprev').innerHTML=prevHtml()};im.src=rd.result};rd.readAsDataURL(f);i.value=''}
function rmImg(){pend=null;var p=editId&&find(S.prendas,editId);if(p&&p.im){p.im=0;delImg(p.id);save();return}q('pprev').innerHTML=prevHtml()}
function save(){dirty=true;armed=null;S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(ref)ref.set({json:JSON.stringify(S)}).catch(function(){});render()}
function go(t){tab=t;armed=null;editId=null;fq='';pend=null;sel={};bcv='';bpv='';bok='';bco='set';bpo='set';brd='0';fcat='';fv='';bsv='';bmr='';fmar='';pre='';isel={};iqty={};iq='';iall='';inum='';iok='';render();window.scrollTo(0,0)}
function btnDel(k,id){return '<button class="sm bad" onclick="del(\''+k+'\',\''+id+'\')">'+(armed===k+id?'¿Seguro?':'Borrar')+'</button>'}
function del(k,id){if(armed!==k+id){armed=k+id;render();return}
 if(k==='p'){delImg(id);S.prendas=S.prendas.filter(function(x){return x.id!==id})}
 if(k==='g')S.gastos=S.gastos.filter(function(x){return x.id!==id});
 if(k==='v'){var v=find(S.ventas,id),p=find(S.prendas,v.pid);if(p)p.s+=v.k;S.ventas=S.ventas.filter(function(x){return x.id!==id})}
 save()}
function addPrenda(){var n=q('pn').value.trim();if(!n){q('pn').focus();return}
 var o={n:n,t:[q('pco').value.trim(),q('pt').value.trim()].filter(Boolean).join(' '),co:q('pco').value.trim(),tl:q('pt').value.trim(),k:q('pk').value.trim(),m:q('pm').value.trim(),s:Math.floor(num('ps')),c:num('pc'),p:num('pp')},e=editId&&find(S.prendas,editId),p=e||Object.assign({id:uid()},o);
 if(e)Object.assign(e,o);else S.prendas.push(p);
 if(pend){p.im=1;setImg(p.id,pend)}pend=null;editId=null;save()}
function editP(id){editId=id;pend=null;render();window.scrollTo(0,0)}
function stk(id,d){var p=find(S.prendas,id);if(p){p.s=Math.max(0,p.s+d);save()}}
function pick(){var p=find(S.prendas,q('vp').value);if(p){q('vpr').value=p.p||'';q('vth').innerHTML=thumb(p,72)}}
function addVenta(){var p=find(S.prendas,q('vp').value);if(!p)return;
 var k=Math.floor(num('vq'))||1,pr=num('vpr'),mp=q('vm').value;
 if(k>p.s){q('vmsg').textContent='Solo quedan '+p.s+' en stock.';return}
 S.ventas.push({id:uid(),pid:p.id,n:p.n,t:p.t,k:k,pr:pr,c:p.c,cl:q('vc').value.trim(),tel:q('vt').value.replace(/\D/g,''),mp:mp,ab:mp==='Fiado'?0:pr*k,d:today()});p.s-=k;save()}
function abona(id,all){var v=find(S.ventas,id),t=tt(v);v.ab=all?t:Math.min(t,v.ab+(parseFloat(q('ab'+id).value)||0));save()}
function addGasto(){var c=q('gc').value.trim(),a=num('ga');
 if(!c||!a){q('gmsg').textContent='Escribe el concepto y el monto.';return}
 S.gastos.push({id:uid(),c:c,a:a,cat:q('gk').value,d:q('gd').value||today()});save()}
function bk(){S.bk=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}var t=JSON.stringify(S),a=q('bkt');a.value=t;a.select();var f=function(){q('bkm').textContent='Selecciona el texto y cópialo.'};try{navigator.clipboard.writeText(t).then(function(){q('bkm').textContent='Copiado. Pégalo en tus notas o en WhatsApp.'},f)}catch(e){f()}}
function rs(){try{var o=JSON.parse(q('bkt').value);if(!o.prendas||!o.ventas||!o.gastos)throw 0;S=norm(o);save();pull()}catch(e){q('bkm').textContent='Ese texto no es un respaldo válido.'}}
var mgn=function(p){return Math.round((p.p-p.c)/p.p*100)};
var opt=function(a,v){return a.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===v?' selected':'')+'>'+o[1]+'</option>'}).join('')};
function nv(op,x,old){var v=parseFloat(x);if(isNaN(v))return old;return op==='set'?v:op==='pct'?old*(1+v/100):old+v}
function rnd(v){if(brd==='0')return v;if(brd==='90')return v<100?v:Math.round(v/100)*100-10;var st=+brd;return Math.round(v/st)*st}
function calc(p){var c=bcv.trim()===''?p.c:nv(bco,bcv,p.c);c=Math.max(0,Math.round(c*100)/100);
 var v=p.p;if(bpv.trim()!==''){v=bpo==='mrg'?c*(1+(parseFloat(bpv)||0)/100):nv(bpo,bpv,p.p);v=rnd(v)}
 return{c:c,p:Math.max(0,Math.round(v*100)/100),s:bsv.trim()===''||isNaN(parseFloat(bsv))?p.s:Math.max(0,Math.floor(p.s+parseFloat(bsv)))}}
function vis(){var f=fq.toLowerCase(),l=S.prendas.filter(function(p){return(p.n+' '+p.t+' '+(p.k||'')+' '+(p.m||'')).toLowerCase().indexOf(f)>-1&&(!fcat||p.k===fcat)&&(!fmar||p.m===fmar)}),g=function(p){return p.p>0?mgn(p):-999};
 if(fso==='a')l.sort(function(a,b){return(a.n+a.t).localeCompare(b.n+b.t)});else if(fso==='s')l.sort(function(a,b){return a.s-b.s});else if(fso==='g')l.sort(function(a,b){return g(b)-g(a)});else l.reverse();return l}
function chg(){return S.prendas.filter(function(p){return sel[p.id]}).map(function(p){return{p:p,n:calc(p)}})}
function prev(){var l=chg(),ok=bcv.trim()!==''||bpv.trim()!==''||bsv.trim()!==''||bmr.trim()!=='';q('bcnt').textContent=l.length;
 q('bprev').innerHTML=(l.length&&ok)?l.slice(0,6).map(function(x){return '<div class="mut'+(x.n.p<x.n.c?' neg':'')+'">'+esc(x.p.n+' '+x.p.t)+': costo '+m(x.p.c)+' → <b>'+m(x.n.c)+'</b>, venta '+m(x.p.p)+' → <b>'+m(x.n.p)+'</b>'+(x.n.s!==x.p.s?', stock '+x.p.s+' → <b>'+x.n.s+'</b>':'')+(bmr.trim()!==''?', marca → <b>'+esc(bmr.trim())+'</b>':'')+(x.n.p<x.n.c?' ⚠ pierdes plata':'')+'</div>'}).join('')+(l.length>6?'<div class="mut">y '+(l.length-6)+' más</div>':''):'';

function tgl(id,el){if(el.checked)sel[id]=1;else delete sel[id];bok='';q('bmsg').textContent='';prev()}

 if(!l.length){mm.className='err';mm.textContent='Marca al menos una prenda.';return}
 if(bcv.trim()===''&&bpv.trim()===''&&bsv.trim()===''&&bmr.trim()===''){mm.className='err';mm.textContent='Escribe qué quieres cambiar.';return}
 S.undo={n:l.length,l:l.map(function(x){return{id:x.p.id,c:x.p.c,p:x.p.p,s:x.p.s,m:x.p.m||''}})};

 return row('Unidades que vendo',String(Math.round(u*f*10)/10))+row('Entra por ventas',m(sv),'pos')+row('Ganancia de esas ventas',m(sv-sc),sv-sc<0?'neg':'pos')+row('Dinero que tengo hoy',m(gsal))+'<div class="row"><b>Dinero total si vendo eso</b><b class="pos">'+m(t)+'</b></div>'+(gdeb>0?row('Más lo que te deben ('+m(gdeb)+')',m(t+gdeb)):'')}
