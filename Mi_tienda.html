<style>
:root{--bg:#F2F2F8;--card:#fff;--ink:#14142B;--mut:#6A6A85;--line:#E3E3EE;--acc:#3B36C8;--accink:#fff;--h1:#2B2790;--h2:#4B3FE0;--lime:#C8F169;--ok:#13795B;--bad:#C2362B;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D0D1A;--card:#171730;--ink:#EDEDFA;--mut:#9A9AB8;--line:#2A2A48;--acc:#A29DFF;--accink:#0D0D1A;--h1:#1B1858;--h2:#3A30B8;--ok:#5FD8A8;--bad:#FF8A7D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D0D1A;--card:#171730;--ink:#EDEDFA;--mut:#9A9AB8;--line:#2A2A48;--acc:#A29DFF;--accink:#0D0D1A;--h1:#1B1858;--h2:#3A30B8;--ok:#5FD8A8;--bad:#FF8A7D;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.sm{line-height:1.25;letter-spacing:0}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.4 "DM Sans",system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:560px;margin:0 auto;padding:8px 12px 100px}
h1{font:700 22px/1.1 "Space Grotesk","DM Sans",system-ui,sans-serif;margin:6px 0 10px}
.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,var(--h1),var(--h2));color:#fff;border-radius:22px;padding:16px;margin-bottom:10px}
.hero::after{content:"";position:absolute;right:-46px;top:-46px;width:160px;height:160px;border-radius:50%;background:rgba(200,241,105,.18)}
.hero small{font-weight:600;opacity:.85}
.hero b{display:block;font:700 34px/1.05 "Space Grotesk","DM Sans",system-ui,sans-serif;color:var(--lime);margin:4px 0 0;word-break:break-all}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;position:relative;z-index:1}
.chip{background:rgba(255,255,255,.15);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600}
.seg{display:flex;background:var(--line);border-radius:14px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;border-radius:11px;padding:8px 4px;background:transparent;color:var(--mut);font:600 15px "DM Sans",system-ui,sans-serif}
.seg .on{background:var(--card);color:var(--ink)}
.card{background:var(--card);border-radius:16px;padding:2px 14px;margin-bottom:10px}
.card.f{padding:12px 14px}
.row,.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
.row+.row,.it+.it,.row+.it,.it+.row{border-top:1px solid var(--line)}
.row b{font-weight:600}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.mut{color:var(--mut);font-size:12.5px}
label{display:block;font-size:13px;font-weight:600;margin:9px 0 3px}
input,select,textarea{width:100%;box-sizing:border-box;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
textarea{font-size:14px;margin-top:10px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{width:100%;margin-top:12px;padding:11px;border:0;border-radius:12px;background:var(--acc);color:var(--accink);font:700 16px "DM Sans",system-ui,sans-serif;line-height:1.25}
.sm{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 12px;font:600 14px "DM Sans",system-ui,sans-serif;line-height:1.25;text-decoration:none;text-align:center;display:inline-block}
.sm.bad{color:var(--bad)}
.stp{display:flex;align-items:center;gap:8px}
.stp .sm[aria-label]{width:38px;height:38px;padding:0;font-size:20px;line-height:36px}
.stp b{min-width:26px;text-align:center;font-size:16px}
.col{display:flex;flex-direction:column;gap:6px}
.badge{display:inline-block;font-size:12px;font-weight:700;background:var(--bad);color:#fff;border-radius:99px;padding:1px 8px;margin-left:6px}
.err{color:var(--bad);font-size:14px;margin:8px 0 0}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.mrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;font-size:14px}
.mrow .bar{margin:6px 0}
.th{border-radius:12px;object-fit:cover;flex:none;background:var(--line)}
.th.ph{display:flex;align-items:center;justify-content:center;font-size:22px}
input[type="checkbox"]{width:22px;height:22px;flex:none;padding:0;margin:0;accent-color:var(--acc)}
.tag{display:inline-block;background:var(--line);color:var(--acc);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;margin-right:6px;cursor:pointer}
.fold{cursor:pointer}.mh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0 4px;border-top:1px solid var(--line)}
label.fb{margin:0;font-size:14px;cursor:pointer;display:inline-block}
#zm{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#zm img{max-width:100%;max-height:85%;border-radius:16px}
#nav{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
#nav div{pointer-events:auto;max-width:520px;margin:0 auto;display:flex;background:var(--card);border-radius:22px;padding:6px;box-shadow:0 6px 24px rgba(20,20,60,.22)}
#nav button{flex:1;border:0;background:transparent;color:var(--mut);border-radius:16px;padding:6px 0 4px;font:600 12px "DM Sans",system-ui,sans-serif}
#nav button span{display:block;font-size:18px;line-height:1.2}
#nav button.on{background:var(--acc);color:var(--accink)}
</style>
</head>

<main id="app"></main>
<nav id="nav"></nav>

var per='mes',editId=null,fq='',pend=null,IMG={},DB=null,BASE='',KEY='ropa-v1',tab='resumen',dirty=false,ref=null,armed=null,sel={},bcv='',bpv='',bok='',bco='set',bpo='set',brd='0',fcat='',fso='n',fv='',bsv='',bmr='',fmar='',sqv='all',spc='',squ='p',gsal=0,gdeb=0,fopen={},pre='',isel={},iqty={},iq='',iall='',inum='',iok='',S=norm();
function norm(o){o=Object.assign({ini:0,min:2,mm:30,marcas:[],bk:0,undo:null,meta:0,prendas:[],ventas:[],gastos:[]},o||{});o.ventas.forEach(function(v){if(v.ab==null)v.ab=v.pd?v.pr*v.k:0});return o}
var okStore=true;try{localStorage.setItem('t','1');localStorage.removeItem('t');var r=localStorage.getItem(KEY);if(r)S=norm(JSON.parse(r))}catch(e){okStore=false}
var q=function(id){return document.getElementById(id)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var m=function(n){return(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('es')};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var today=function(){return new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)};
var fd=function(d){return d.slice(8)+'/'+d.slice(5,7)};

var find=function(l,id){return l.find(function(x){return x.id===id})};
function getImg(id){if(IMG[id])return IMG[id];try{var u=localStorage.getItem('ropa-img-'+id);if(u)IMG[id]=u;return u}catch(e){return null}}
