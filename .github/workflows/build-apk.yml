name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Crear proyecto Capacitor y agregar Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          node -e 'require("fs").writeFileSync("capacitor.config.json", JSON.stringify({appId:"com.mitienda.app",appName:"Mi tienda",webDir:"www"}, null, 2))'
          npx cap add android
          npx cap sync android

      - name: Aceptar licencias SDK y compilar APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Subir APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Mi-tienda-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
