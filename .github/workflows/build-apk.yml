name: Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar proyecto Capacitor
        run: |
          if [ ! -f "www/index.html" ]; then
            mkdir -p www
            if [ -f "index.html" ]; then
              cp index.html www/index.html
            else
              HTML_FILE=$(find . -maxdepth 1 -type f -name "*.html" | head -n 1)
              if [ -z "$HTML_FILE" ]; then
                echo "Error: No se encontró ningún archivo .html en la raíz del repositorio."
                exit 1
              fi
              cp "$HTML_FILE" www/index.html
            fi
          fi
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'com.mitienda.app',appName:'Mi tienda',webDir:'www'},null,2))"
          npx cap add android
          npx cap sync android

      - name: Aceptar licencias de Android SDK
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Mi-tienda.apk

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Mi-tienda-APK
          path: Mi-tienda.apk
